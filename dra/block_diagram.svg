<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="title desc">
  <title id="title">RX / TX DRA Architecture - AGRW027/039 Device Clusters</title>
  <desc id="desc">Uplink 14.0-14.5 GHz with 32 spot beams on 4 RX devices; downlink 10.7-12.75 GHz with 40/32 beams on 5 TX devices; onboard router fabric between clusters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071420"/>
      <stop offset="55%" stop-color="#0B2434"/>
      <stop offset="100%" stop-color="#123044"/>
    </linearGradient>
    <linearGradient id="rxBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E6B7A"/>
      <stop offset="100%" stop-color="#1A9AAB"/>
    </linearGradient>
    <linearGradient id="txBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A4B12"/>
      <stop offset="100%" stop-color="#C2772A"/>
    </linearGradient>
    <linearGradient id="routerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B3F66"/>
      <stop offset="100%" stop-color="#2A5F8F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5FD0E0"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E0A45F"/>
    </marker>
    <marker id="arrowWhite" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#C9D7E3"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <circle cx="1380" cy="120" r="180" fill="#1A9AAB" opacity="0.06"/>
  <circle cx="180" cy="980" r="220" fill="#C2772A" opacity="0.05"/>

  <!-- Header -->
  <text x="56" y="48" fill="#5FD0E0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ALTERA | SPACE / NTN PAYLOAD</text>
  <text x="56" y="88" fill="#F2F6F9" font-family="Georgia, 'Times New Roman', serif" font-size="34">RX / TX Direct Radiating Array Architecture</text>
  <text x="56" y="118" fill="#9BB0C0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">AGRW027/039 device clusters | Direct-RF 64 Gsps | Separate TX/RX silicon paths (9 devices)</text>

  <!-- Legend -->
  <g transform="translate(1180, 42)">
    <rect width="360" height="70" rx="8" fill="#0E1F2C" stroke="#2A4558"/>
    <rect x="16" y="18" width="18" height="12" rx="2" fill="url(#rxBand)"/>
    <text x="42" y="28" fill="#C9D7E3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">RX Uplink 14.0-14.5 GHz | 32 beams</text>
    <rect x="16" y="42" width="18" height="12" rx="2" fill="url(#txBand)"/>
    <text x="42" y="52" fill="#C9D7E3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">TX Downlink 10.7-12.75 GHz | 40/32 beams</text>
  </g>

  <!-- ========== RX SECTION ========== -->
  <g filter="url(#soft)">
    <rect x="40" y="150" width="1520" height="380" rx="14" fill="#0A1A26" stroke="#1F4A55" stroke-width="1.5"/>
  </g>
  <rect x="40" y="150" width="10" height="380" rx="2" fill="url(#rxBand)"/>
  <text x="68" y="178" fill="#5FD0E0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">RX DRA - UPLINK</text>
  <text x="68" y="200" fill="#F2F6F9" font-family="Georgia, 'Times New Roman', serif" font-size="20">14.0-14.5 GHz | 32 spot beams | 4x AGRW027/039 (ADC side)</text>

  <!-- RX front-end chain -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="68" y="230" width="150" height="70" rx="8" fill="#123445" stroke="#2A7A88"/>
    <text x="143" y="260" text-anchor="middle" fill="#F2F6F9" font-size="13" font-weight="700">Antenna /</text>
    <text x="143" y="278" text-anchor="middle" fill="#F2F6F9" font-size="13" font-weight="700">Feed Array</text>

    <line x1="218" y1="265" x2="248" y2="265" stroke="#5FD0E0" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="250" y="230" width="130" height="70" rx="8" fill="#123445" stroke="#2A7A88"/>
    <text x="315" y="260" text-anchor="middle" fill="#F2F6F9" font-size="13" font-weight="700">LNA</text>
    <text x="315" y="278" text-anchor="middle" fill="#9BB0C0" font-size="11">Front-End</text>

    <line x1="380" y1="265" x2="410" y2="265" stroke="#5FD0E0" stroke-width="2" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- RX device cluster -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="412" y="220" width="560" height="100" rx="10" fill="#0E2A35" stroke="#1A9AAB" stroke-width="1.5"/>
    <text x="428" y="242" fill="#5FD0E0" font-size="11" font-weight="700" letter-spacing="1">RX DEVICE CLUSTER</text>
    <!-- 4 devices -->
    <g>
      <rect x="428" y="252" width="124" height="54" rx="6" fill="#154854"/>
      <text x="490" y="274" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 1</text>
      <text x="490" y="292" text-anchor="middle" fill="#9BB0C0" font-size="10">8 ADC | Beams 1-8</text>
    </g>
    <g>
      <rect x="560" y="252" width="124" height="54" rx="6" fill="#154854"/>
      <text x="622" y="274" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 2</text>
      <text x="622" y="292" text-anchor="middle" fill="#9BB0C0" font-size="10">8 ADC | Beams 9-16</text>
    </g>
    <g>
      <rect x="692" y="252" width="124" height="54" rx="6" fill="#154854"/>
      <text x="754" y="274" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 3</text>
      <text x="754" y="292" text-anchor="middle" fill="#9BB0C0" font-size="10">8 ADC | Beams 17-24</text>
    </g>
    <g>
      <rect x="824" y="252" width="124" height="54" rx="6" fill="#154854"/>
      <text x="886" y="274" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 4</text>
      <text x="886" y="292" text-anchor="middle" fill="#9BB0C0" font-size="10">8 ADC | Beams 25-32</text>
    </g>
  </g>

  <!-- Per-device DSP pipeline RX -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="68" y="360" fill="#9BB0C0" font-size="12" font-weight="700" letter-spacing="1">PER DEVICE DSP PIPELINE</text>

    <rect x="68" y="375" width="175" height="58" rx="7" fill="#123445" stroke="#2A7A88"/>
    <text x="155" y="400" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Direct-RF ADC</text>
    <text x="155" y="418" text-anchor="middle" fill="#9BB0C0" font-size="10">64 Gsps | 1st Nyquist</text>

    <line x1="243" y1="404" x2="268" y2="404" stroke="#5FD0E0" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="270" y="375" width="90" height="58" rx="7" fill="#123445" stroke="#2A7A88"/>
    <text x="315" y="410" text-anchor="middle" fill="#F2F6F9" font-size="13" font-weight="700">DDC</text>

    <line x1="360" y1="404" x2="385" y2="404" stroke="#5FD0E0" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="387" y="375" width="220" height="58" rx="7" fill="#123445" stroke="#2A7A88"/>
    <text x="497" y="400" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Digital Beamforming</text>
    <text x="497" y="418" text-anchor="middle" fill="#9BB0C0" font-size="10">4-color | 8-way spatial reuse</text>

    <line x1="607" y1="404" x2="632" y2="404" stroke="#5FD0E0" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="634" y="375" width="210" height="58" rx="7" fill="#123445" stroke="#2A7A88"/>
    <text x="739" y="400" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">UL Channelizer</text>
    <text x="739" y="418" text-anchor="middle" fill="#9BB0C0" font-size="10">4 | 125 MHz / beam</text>

    <line x1="844" y1="404" x2="869" y2="404" stroke="#5FD0E0" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="871" y="375" width="250" height="58" rx="7" fill="#123445" stroke="#2A7A88"/>
    <text x="996" y="400" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">DVB-RCS2 / 3GPP-NTN</text>
    <text x="996" y="418" text-anchor="middle" fill="#9BB0C0" font-size="10">Low-PHY handoff</text>
  </g>

  <!-- RX notes -->
  <text x="68" y="470" fill="#7A93A6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Quad-core Arm Cortex-A53 (HPS) per device | Multi-device phase-sync IP for coherent beamforming</text>
  <text x="68" y="494" fill="#7A93A6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Conservative isolation option: TX and RX on physically separate silicon / RF paths</text>

  <!-- Arrow RX | Router -->
  <line x1="800" y1="530" x2="800" y2="560" stroke="#C9D7E3" stroke-width="2.5" marker-end="url(#arrowWhite)"/>

  <!-- ========== ROUTER ========== -->
  <g filter="url(#soft)">
    <rect x="280" y="565" width="1040" height="80" rx="12" fill="url(#routerGrad)" stroke="#4A7DB0" stroke-width="1.5"/>
  </g>
  <text x="800" y="600" text-anchor="middle" fill="#F2F6F9" font-family="Georgia, 'Times New Roman', serif" font-size="20">Onboard Router / Switch Fabric</text>
  <text x="800" y="625" text-anchor="middle" fill="#B8D0E8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">58 Gbps SerDes interconnect between device clusters and Feeder-link stage</text>

  <!-- Arrow Router | TX -->
  <line x1="800" y1="645" x2="800" y2="675" stroke="#C9D7E3" stroke-width="2.5" marker-end="url(#arrowWhite)"/>

  <!-- ========== TX SECTION ========== -->
  <g filter="url(#soft)">
    <rect x="40" y="680" width="1520" height="380" rx="14" fill="#1A140C" stroke="#5A3A1A" stroke-width="1.5"/>
  </g>
  <rect x="40" y="680" width="10" height="380" rx="2" fill="url(#txBand)"/>
  <text x="68" y="708" fill="#E0A45F" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TX DRA - DOWNLINK</text>
  <text x="68" y="730" fill="#F2F6F9" font-family="Georgia, 'Times New Roman', serif" font-size="20">10.7-12.75 GHz | 40 spot beams (NTN) / 32 (DVB-S2X) | 5x AGRW027/039 (DAC side)</text>

  <!-- Per-device TX DSP -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="68" y="760" fill="#B8A090" font-size="12" font-weight="700" letter-spacing="1">PER DEVICE DSP PIPELINE</text>

    <rect x="68" y="775" width="230" height="58" rx="7" fill="#2A1E12" stroke="#8A5A28"/>
    <text x="183" y="800" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">DVB-S2X / 3GPP-NTN</text>
    <text x="183" y="818" text-anchor="middle" fill="#C4A88A" font-size="10">Low-PHY framer</text>

    <line x1="298" y1="804" x2="323" y2="804" stroke="#E0A45F" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <rect x="325" y="775" width="220" height="58" rx="7" fill="#2A1E12" stroke="#8A5A28"/>
    <text x="435" y="800" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Digital Beamforming</text>
    <text x="435" y="818" text-anchor="middle" fill="#C4A88A" font-size="10">4-color | 8-10 way spatial reuse</text>

    <line x1="545" y1="804" x2="570" y2="804" stroke="#E0A45F" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <rect x="572" y="775" width="90" height="58" rx="7" fill="#2A1E12" stroke="#8A5A28"/>
    <text x="617" y="810" text-anchor="middle" fill="#F2F6F9" font-size="13" font-weight="700">DUC</text>

    <line x1="662" y1="804" x2="687" y2="804" stroke="#E0A45F" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <rect x="689" y="775" width="200" height="58" rx="7" fill="#2A1E12" stroke="#8A5A28"/>
    <text x="789" y="800" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Direct-RF DAC</text>
    <text x="789" y="818" text-anchor="middle" fill="#C4A88A" font-size="10">64 Gsps synthesis</text>
  </g>

  <!-- TX device cluster -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="68" y="860" width="920" height="100" rx="10" fill="#24180E" stroke="#C2772A" stroke-width="1.5"/>
    <text x="84" y="882" fill="#E0A45F" font-size="11" font-weight="700" letter-spacing="1">TX DEVICE CLUSTER</text>
    <g>
      <rect x="84" y="892" width="160" height="52" rx="6" fill="#3A2814"/>
      <text x="164" y="913" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 1</text>
      <text x="164" y="930" text-anchor="middle" fill="#C4A88A" font-size="10">8 DAC | Beams 1-8</text>
    </g>
    <g>
      <rect x="254" y="892" width="160" height="52" rx="6" fill="#3A2814"/>
      <text x="334" y="913" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 2</text>
      <text x="334" y="930" text-anchor="middle" fill="#C4A88A" font-size="10">8 DAC | Beams 9-16</text>
    </g>
    <g>
      <rect x="424" y="892" width="160" height="52" rx="6" fill="#3A2814"/>
      <text x="504" y="913" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 3</text>
      <text x="504" y="930" text-anchor="middle" fill="#C4A88A" font-size="10">8 DAC | Beams 17-24</text>
    </g>
    <g>
      <rect x="594" y="892" width="160" height="52" rx="6" fill="#3A2814"/>
      <text x="674" y="913" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 4</text>
      <text x="674" y="930" text-anchor="middle" fill="#C4A88A" font-size="10">8 DAC | Beams 25-32</text>
    </g>
    <g>
      <rect x="764" y="892" width="200" height="52" rx="6" fill="#3A2814" stroke="#E0A45F" stroke-dasharray="4 3"/>
      <text x="864" y="913" text-anchor="middle" fill="#F2F6F9" font-size="12" font-weight="700">Device 5 *</text>
      <text x="864" y="930" text-anchor="middle" fill="#C4A88A" font-size="10">8 DAC | Beams 33-40</text>
    </g>
  </g>

  <!-- TX back-end -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="988" y1="910" x2="1020" y2="910" stroke="#E0A45F" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <rect x="1022" y="875" width="130" height="70" rx="8" fill="#2A1E12" stroke="#8A5A28"/>
    <text x="1087" y="905" text-anchor="middle" fill="#F2F6F9" font-size="13" font-weight="700">HPA</text>
    <text x="1087" y="923" text-anchor="middle" fill="#C4A88A" font-size="11">Front-End</text>

    <line x1="1152" y1="910" x2="1184" y2="910" stroke="#E0A45F" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <rect x="1186" y="875" width="150" height="70" rx="8" fill="#2A1E12" stroke="#8A5A28"/>
    <text x="1261" y="905" text-anchor="middle" fill="#F2F6F9" font-size="13" font-weight="700">Antenna /</text>
    <text x="1261" y="923" text-anchor="middle" fill="#F2F6F9" font-size="13" font-weight="700">Feed Array</text>
  </g>

  <!-- TX footnote -->
  <text x="68" y="1005" fill="#A89070" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">* Device 5 carries 4 spare/idle DAC channels when operating in DVB-S2X-only mode (32 beams)</text>
  <text x="68" y="1028" fill="#A89070" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Total: 9 devices (5 TX + 4 RX) | Cleanest TX-RX isolation | Phase-sync across cluster</text>

  <!-- Footer -->
  <text x="800" y="1078" text-anchor="middle" fill="#5A7080" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">AGRW027/039 | Ku-band DRA Payload Architecture</text>
</svg>
